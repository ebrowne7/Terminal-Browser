<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERM-OS v1.09 (1998)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="terminal-container" onclick="document.getElementById('cmd-input').focus()">
    <!-- HUD Panel -->
    <div class="hud-bar">
      <div>NODE: <span id="hud-node">LOCALHOST (127.0.0.1)</span></div>
      <div class="trace-wrapper">
        <span>TRACE:</span>
        <div class="trace-meter">
          <div id="trace-fill"></div>
        </div>
        <span id="trace-val">0%</span>
      </div>
    </div>

    <section class="mission-panel" aria-label="Active contract">
      <div class="mission-panel-heading">
        <span>ACTIVE CONTRACT</span>
        <span id="mission-state">ACTIVE</span>
      </div>
      <div class="mission-location">
        <span id="mission-level">LEVEL 01/10</span>
        <strong id="mission-level-title">FIRST CONTRACT</strong>
        <span id="mission-stage">STAGE 01/10: FIRST CONTACT</span>
      </div>
      <div id="mission-target" class="mission-target"></div>
      <div id="mission-objectives" class="mission-objectives"></div>
    </section>

    <div id="output-log"></div>
    <div class="input-line">
      <span class="prompt" id="prompt-label">root@localhost:~#</span>
      <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" />
    </div>
    <div class="recovery-controls" id="recovery-controls" aria-live="polite">
      <button type="button" id="load-game-button">LOAD GAME</button>
      <button type="button" id="reset-game-button">RESET GAME</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
