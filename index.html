<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERM-OS v1.09 (1998)</title>
  <style>
    :root {
      --bg-color: #0d0f0d;
      --text-color: #33ff33;
      --text-dim: #1b8a1b;
      --text-alert: #ff3333;
      --text-warn: #ffaa00;
      --font-family: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .terminal-container {
      width: 100%;
      max-width: 900px;
      height: 600px;
      border: 2px solid var(--text-dim);
      box-shadow: 0 0 15px rgba(51, 255, 51, 0.2);
      padding: 15px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(0, 15, 0, 0.95);
    }

    /* Top HUD Panel */
    .hud-bar {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--text-dim);
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: bold;
    }

    .trace-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trace-meter {
      width: 120px;
      height: 12px;
      border: 1px solid var(--text-color);
      background: #000;
      position: relative;
    }

    #trace-fill {
      width: 0%;
      height: 100%;
      background: var(--text-color);
      transition: width 0.2s ease, background-color 0.2s ease;
    }

    /* Screen CRT overlay */
    .terminal-container::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    #output-log {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .input-line {
      display: flex;
      align-items: center;
      font-size: 14px;
    }

    .prompt {
      margin-right: 8px;
      color: var(--text-color);
      font-weight: bold;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-family: var(--font-family);
      font-size: 14px;
    }

    .dim { color: var(--text-dim); }
    .warn { color: var(--text-warn); }
    .alert { color: var(--text-alert); font-weight: bold; }
  </style>
</head>
<body>

  <div class="terminal-container" onclick="document.getElementById('cmd-input').focus()">
    <!-- HUD Panel -->
    <div class="hud-bar">
      <div>NODE: <span id="hud-node">LOCALHOST (127.0.0.1)</span></div>
      <div class="trace-wrapper">
        <span>TRACE:</span>
        <div class="trace-meter">
          <div id="trace-fill"></div>
        </div>
        <span id="trace-val">0%</span>
      </div>
    </div>

    <div id="output-log"></div>
    <div class="input-line">
      <span class="prompt" id="prompt-label">root@localhost:~#</span>
      <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <script src="terminal.js"></script>
</body>
</html>
